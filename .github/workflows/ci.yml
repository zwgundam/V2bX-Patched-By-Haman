name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GONOSUMDB: github.com/MoeclubM/sing-box_mod

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: GOEXPERIMENT=jsonv2 go test ./...

      - name: Build V2bX
        run: |
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/V2bX -tags "sing with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-X 'github.com/MoeclubM/V2bX/cmd.version=${{ github.sha }}' -s -w -buildid="
